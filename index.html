
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESFIS - Election Synchronization Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* High Visibility Scrollbars for Timeline */
        .sidebar-scroll::-webkit-scrollbar {
            width: 8px;
            height: 10px;
        }
        .sidebar-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
            border: 2px solid #f1f5f9;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb:hover {
            background: #1d4ed8; /* Deep Blue on hover */
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .mesh-gradient {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(191, 219, 254, 0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, rgba(254, 215, 170, 0.2) 0, transparent 50%), 
                radial-gradient(at 50% 100%, rgba(187, 247, 208, 0.2) 0, transparent 50%);
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>

  }
}
